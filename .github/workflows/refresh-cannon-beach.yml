name: Refresh Cannon Beach dashboard

on:
  schedule:
    - cron: "45 13 * * *"   # 6:45 AM Arizona time, every day
    - cron: "20 15 * * *"   # 8:20 AM backup (GitHub sometimes skips scheduled runs)
    - cron: "35 18 * * *"   # 11:35 AM backup
  workflow_dispatch: {}     # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: refresh-cannon-beach
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Windsor data, check it, update data.json
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python scripts/refresh_cannon_beach.py

      - name: Commit if changed
        run: |
          git config user.name "KTR dashboard refresh"
          git config user.email "actions@users.noreply.github.com"
          git add ktr-cannon-beach/data.json
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "Cannon Beach data refresh $(TZ=America/Phoenix date +%F)"
            git push
          fi
